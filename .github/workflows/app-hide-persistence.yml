name: "AppHide persistence: test and build"

on:
  push:
    branches: ["fix/app-hide-persistence-3.0.10.2", "fix/environment-readonly-diagnostics", "fix/jb-entry-recovery", "fix/jb-entry-guard-stage1", "fix/jb-visibility-transitions"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Xcode Setup
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive


      - name: Test real AppHide persistence methods
        run: |
          python3 Tests/run_app_hide_tests.py
          python3 Tests/run_diagnostic_tests.py
          python3 Tests/run_recovery_tests.py
          python3 Tests/run_entry_guard_tests.py
          python3 Tests/run_entry_restore_tests.py
          python3 Tests/run_audit_restore_tests.py
          python3 Tests/run_quarantine_transaction_tests.py
          python3 Tests/reproduce_visibility_state.py
          python3 Tests/run_visibility_state_tests.py
          python3 Tests/run_visibility_integration_tests.py
          python3 Tests/reproduce_entry_race.py --output "$RUNNER_TEMP/entry-evidence"

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/.swiftpm
          key: swiftpm-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            swiftpm-${{ runner.os }}-


      - name: Cache Theos
        uses: actions/cache@v4
        with:
          path: theos
          key: theos-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            theos-${{ runner.os }}-


      - name: Cache Xcode DerivedData
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: xcode-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            xcode-${{ runner.os }}-


      - name: Cache trustcache
        uses: actions/cache@v4
        with:
          path: trustcache
          key: trustcache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            trustcache-${{ runner.os }}-

      - name: Install Procursus
        uses: dhinakg/procursus-action@main
        with:
          packages: ldid findutils sed coreutils make

      - name: Install better GNU Make
        run: |
          brew install make
          echo "PATH=$(brew --prefix make)/libexec/gnubin:$PATH" >> $GITHUB_ENV

      - name: Install THEOS
        run: |
          set -x
          export BASEDIR="$(pwd)"
          export THEOS="${BASEDIR}/theos"
          if [ -d "$THEOS/sdks/iPhoneOS16.5.sdk" ]; then
            echo "Theos already cached, skipping install"
            exit 0
          fi
          mkdir -p $THEOS
          curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos >> install-theos.sh
          gsed -E "/^\s*get_theos\s*$/,+1 s/^(\s*)(get_sdks)\s*$/\1mkdir -p \${THEOS}\/sdks\n\1touch \${THEOS}\/sdks\/sdk\n\1\2/g" -i install-theos.sh
          bash install-theos.sh
          curl -L https://github.com/theos/sdks/releases/latest/download/iPhoneOS16.5.sdk.tar.xz --output $THEOS/sdks/iPhoneOS16.5.sdk.tar.xz
          tar -xJf $THEOS/sdks/iPhoneOS16.5.sdk.tar.xz -C $THEOS/sdks
          rm $THEOS/sdks/iPhoneOS16.5.sdk.tar.xz
          cd $BASEDIR

      - name: Build and Install trustcache
        run: |
          set -x
          if [ ! -d trustcache ]; then
            git clone https://github.com/CRKatri/trustcache
          fi
          cd trustcache
          export CFLAGS="$CFLAGS -I$(brew --prefix openssl)/include -arch $(uname -m)"
          export LDFLAGS="$LDFLAGS -L$(brew --prefix openssl)/lib -arch $(uname -m)"
          gmake -j$(sysctl -n hw.logicalcpu) OPENSSL=1
          sudo cp trustcache /opt/procursus/bin/

      - name: Set Environment Variables
        run: |
          set -x
          T2=$(TZ=UTC-2 date +'%Y%m%d_%H%M%S')
          TS=$(date -j -f "%Y%m%d_%H%M%S" "${T2}" +%s)
          SHASH=$(git rev-parse --short HEAD)
          echo "ctime=${T2}" >> $GITHUB_ENV
          echo "ctimestamp=${TS}" >> $GITHUB_ENV
          echo "shorthash=${SHASH}" >> $GITHUB_ENV

      - name: Install libarchive
        run: brew install libarchive

      - name: Download Bootstraps
        run: |
          set -x
          cd Application/Dopamine/Resources
          ./download_bootstraps.sh

      - name: Build
        run: |
          set -x
          export BASEDIR="$(pwd)"
          export THEOS="${BASEDIR}/theos"
          gmake -j$(sysctl -n hw.logicalcpu) NIGHTLY=1

      - name: Record build identity
        run: |
          git rev-parse HEAD > Application/BUILD-COMMIT.txt
          shasum -a 256 Application/Dopamine.ipa > Application/SHA256SUMS.txt

      - name: Upload Artifact
        id: dopamine-latest-upload
        uses: actions/upload-artifact@v4
        with:
          name: Dopamine-validation-${{ github.sha }}
          if-no-files-found: error
          path: |
            ${{ github.workspace }}/Application/Dopamine.ipa
            ${{ github.workspace }}/Application/BUILD-COMMIT.txt
            ${{ github.workspace }}/Application/SHA256SUMS.txt
